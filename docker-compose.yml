services:
  postgres:
    image: postgres:15-alpine
    container_name: toktickit-postgres
    environment:
      POSTGRES_DB: toktickit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5434:5432'
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - toktickit-postgres-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d toktickit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toktickit-postgres-data:
